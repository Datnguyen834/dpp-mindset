<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị — Mindset DPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#142316] via-[#1f3b21] to-[#0d170f] min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#F9FAF6] p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20">
        <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold mb-2">MINDSET ADMIN PORTAL</span>
            <h1 class="text-2xl font-extrabold text-[#142316]">Quản trị Hộ chiếu số</h1>
            <p class="text-xs text-slate-500 mt-1">Cổng nội bộ dành riêng cho Quản trị viên (Tách biệt khỏi trang QR công khai)</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Tài khoản Quản trị</label>
                <input type="text" id="username" value="admin" required
                    class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-700 focus:border-emerald-700 outline-none transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Mật khẩu</label>
                <input type="password" id="password" value="admin@123" required
                    class="w-full px-4 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-700 focus:border-emerald-700 outline-none transition">
            </div>

            <div id="error-box" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs font-medium text-center"></div>

            <button type="submit"
                class="w-full py-3 bg-[#234B24] hover:bg-emerald-800 text-white rounded-xl font-bold text-sm shadow-md transition">
                Đăng nhập vào Bảng điều khiển
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-200 text-center">
            <p class="text-[11px] text-slate-500">Mặc định: <code class="bg-slate-200 px-1.5 py-0.5 rounded font-bold text-slate-800">admin</code> / <code class="bg-slate-200 px-1.5 py-0.5 rounded font-bold text-slate-800">admin@123</code></p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errBox = document.getElementById('error-box');
            errBox.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('mindset_admin_token', data.token);
                    window.location.href = '/admin/dashboard';
                } else {
                    errBox.textContent = data.error || 'Đăng nhập thất bại!';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = 'Không thể kết nối tới Server Backend!';
                errBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
